<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Gallery Section</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --wall-color: #1a1a1a;
            --lamp-gold: linear-gradient(145deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --frame-wood: linear-gradient(135deg, #3d2b1f 0%, #1a110a 100%);
            --warm-glow: rgba(255, 200, 80, 0.4);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Georgia', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .section-wrapper {
            display: flex;
            width: 90%;
            max-width: 1200px;
            align-items: center;
            justify-content: space-between;
            gap: 80px;
        }

        /* --- Left Side --- */
        .content {
            flex: 1;
        }

        .content h1 {
            font-size: 3rem;
            margin-bottom: 24px;
            font-weight: 400;
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .content p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #999;
            max-width: 480px;
        }

        /* --- Right Side: Visuals --- */
        .visuals {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Realistic Lamp --- */
        .lamp-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lamp-mount {
            width: 40px;
            height: 10px;
            background: var(--lamp-gold);
            border-radius: 5px 5px 0 0;
        }

        .lamp-arm {
            width: 4px;
            height: 30px;
            background: #aa771c;
        }

        .lamp-head {
            width: 120px;
            height: 40px;
            background: var(--lamp-gold);
            border-radius: 100px 100px 20px 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            position: relative;
        }

        /* The Animated Soft Glow */
        .soft-light {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 500px;
            background: radial-gradient(circle at top, var(--warm-glow) 0%, transparent 70%);
            filter: blur(40px);
            z-index: 1;
            pointer-events: none;
            animation: breathe 5s infinite alternate ease-in-out;
        }

        /* --- Realistic Photo Frame --- */
        .frame-container {
            position: relative;
            z-index: 5;
            padding: 18px; /* Frame thickness */
            background: var(--frame-wood);
            border: 1px solid #000;
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.8),
                inset 2px 2px 5px rgba(255,255,255,0.1),
                inset -2px -2px 5px rgba(0,0,0,0.5);
            margin-top: -5px;
        }

        .frame-matting {
            padding: 20px; /* White border inside frame */
            background: #fdfdfd;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            display: flex;
        }

        .photo {
            width: 300px;
            height: 400px;
            background: #222;
            overflow: hidden;
            position: relative;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.1) brightness(0.9);
            transition: 0.5s ease;
        }

        /* Surface glare on the glass */
        .glass-glare {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
            z-index: 2;
            pointer-events: none;
        }

        /* Animation Keyframes */
        @keyframes breathe {
            0% { opacity: 0.5; transform: translateX(-50%) scale(0.95); }
            100% { opacity: 0.9; transform: translateX(-50%) scale(1.05); }
        }

        /* Responsive */
        @media (max-width: 900px) {
            .section-wrapper {
                flex-direction: column;
                text-align: center;
                padding: 60px 0;
            }
            .content p { margin: 0 auto; }
        }
    </style>
</head>
<body>

    <section class="section-wrapper">
        <!-- Text Content -->
        <div class="content">
            <h1>Legacy</h1>
            <p>
                Captured in a single moment, held for a lifetime. This portrait embodies 
                the quiet strength of fatherhood and the soft innocence of a new generation. 
                Our archival framing ensures that these shadows and highlights remain 
                as vivid as the day they were lived.
            </p>
        </div>

        <!-- Visual Content -->
        <div class="visuals">
            <!-- Lamp Structure -->
            <div class="lamp-container">
                <div class="lamp-mount"></div>
                <div class="lamp-arm"></div>
                <div class="lamp-head"></div>
                <!-- This is the animated light -->
                <div class="soft-light"></div>
            </div>

            <!-- Frame Structure -->
            <div class="frame-container">
                <div class="frame-matting">
                    <div class="photo">
                        <div class="glass-glare"></div>
                        <!-- B&W Father and Child Photo -->
                        <img src="https://images.unsplash.com/photo-1542044896530-05d85be9b11a?q=80&w=600" alt="Father holding child">
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
