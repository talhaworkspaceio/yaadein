<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing Gallery Section</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-glow: rgba(255, 240, 150, 0.4);
            --lamp-head: #2c2c2c;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .section-container {
            display: flex;
            max-width: 1100px;
            width: 90%;
            align-items: center;
            justify-content: space-between;
            gap: 60px;
            padding: 40px;
        }

        /* --- Left Side: Content --- */
        .content-left {
            flex: 1;
        }

        .content-left h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            color: #ffffff;
            letter-spacing: -1px;
        }

        .content-left p {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #b0b0b0;
            max-width: 450px;
        }

        /* --- Right Side: Visuals --- */
        .visual-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* The Lamp Structure */
        .lamp-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .lamp-cord {
            width: 2px;
            height: 50px;
            background: #333;
        }

        .lamp-head {
            width: 80px;
            height: 45px;
            background: var(--lamp-head);
            border-radius: 40px 40px 5px 5px;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.1);
        }

        /* The Glow Effect */
        .light-beam {
            position: absolute;
            top: 40px; /* starts inside the lamp head */
            width: 200px;
            height: 350px;
            background: radial-gradient(circle at top, var(--accent-glow) 0%, transparent 70%);
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
            filter: blur(15px);
            pointer-events: none;
            z-index: 5;
            animation: flicker 4s infinite alternate;
        }

        /* The Photo Frame */
        .photo-frame {
            width: 320px;
            height: 420px;
            border: 15px solid #1a1a1a;
            background: #000;
            margin-top: -10px; /* Tucked under the lamp */
            position: relative;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.8),
                inset 0 0 50px rgba(0,0,0,0.5);
            overflow: hidden;
            z-index: 2;
            transition: transform 0.3s ease;
        }

        .photo-frame:hover {
            transform: scale(1.02);
        }

        /* Simulated highlight on top of frame where light hits */
        .photo-frame::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255,240,150,0.15) 0%, transparent 40%);
            pointer-events: none;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7; /* Makes it look like it's in a dark room */
            filter: sepia(0.2) contrast(1.1);
        }

        /* Animation for a realistic light feel */
        @keyframes flicker {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
            52% { opacity: 0.9; }
            54% { opacity: 1; }
        }

        /* Mobile Responsive */
        @media (max-width: 850px) {
            .section-container {
                flex-direction: column;
                text-align: center;
                padding-top: 80px;
            }
            .content-left p {
                margin: 0 auto 40px auto;
            }
        }
    </style>
</head>
<body>

    <section class="section-container">
        <!-- Left Side -->
        <div class="content-left">
            <h1>Timeless<br>Moments</h1>
            <p>
                Every picture tells a story, but the right light brings it to life. 
                Explore our curated collection of vintage photography, captured through 
                the lens of history and illuminated for the modern eye.
            </p>
        </div>

        <!-- Right Side -->
        <div class="visual-right">
            <!-- Lamp Section -->
            <div class="lamp-wrapper">
                <div class="lamp-cord"></div>
                <div class="lamp-head"></div>
                <div class="light-beam"></div>
            </div>

            <!-- Frame Section -->
            <div class="photo-frame">
                <!-- Using a high-quality placeholder image -->
                <img src="https://images.unsplash.com/photo-1554941068-a252680d25d9?auto=format&fit=crop&q=80&w=600" alt="Vintage Camera">
            </div>
        </div>
    </section>

</body>
</html>
